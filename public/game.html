<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monarch MMORPG - GBA Style</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Courier New', Courier, monospace; }
        #game-container { position: relative; }
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            pointer-events: none;
            text-shadow: 2px 2px #000;
        }
        .modal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            border: 4px solid #fff;
            padding: 20px;
            color: #fff;
            text-align: center;
            z-index: 100;
        }
        .btn {
            background: #fff;
            color: #000;
            border: none;
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn:hover { background: #ccc; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui-layer">
            <div>LVL: <span id="lvl">1</span></div>
            <div>XP: <span id="xp">0</span></div>
            <div>INT: <span id="int">5</span></div>
        </div>

        <div id="exam-modal" class="modal">
            <h2 id="question-text">EXAM TRIGGERED!</h2>
            <div id="options-container"></div>
            <p id="timer">Time Remaining: 30s</p>
        </div>
    </div>

    <script>
        const config = {
            type: Phaser.AUTO,
            width: 800,
            height: 600,
            parent: 'game-container',
            physics: {
                default: 'arcade',
                arcade: { gravity: { y: 0 } }
            },
            scene: {
                preload: preload,
                create: create,
                update: update
            }
        };

        const game = new Phaser.Game(config);
        let player;
        let cursors;
        let isLocked = false;

        function preload() {
            this.load.image('tiles', 'https://labs.phaser.io/assets/tilemaps/tiles/tmw_desert_spacing.png');
            this.load.spritesheet('player', 'https://labs.phaser.io/assets/sprites/dude.png', { frameWidth: 32, frameHeight: 48 });
        }

        function create() {
            player = this.physics.add.sprite(400, 300, 'player');
            player.setCollideWorldBounds(true);

            this.anims.create({
                key: 'left',
                frames: this.anims.generateFrameNumbers('player', { start: 0, end: 3 }),
                frameRate: 10,
                repeat: -1
            });

            this.anims.create({
                key: 'turn',
                frames: [ { key: 'player', frame: 4 } ],
                frameRate: 20
            });

            this.anims.create({
                key: 'right',
                frames: this.anims.generateFrameNumbers('player', { start: 5, end: 8 }),
                frameRate: 10,
                repeat: -1
            });

            cursors = this.input.keyboard.createCursorKeys();

            setTimeout(() => {
                triggerExam();
            }, 5000);
        }

        function update() {
            if (isLocked) {
                player.setVelocity(0);
                player.anims.play('turn');
                return;
            }

            if (cursors.left.isDown) {
                player.setVelocityX(-160);
                player.anims.play('left', true);
            } else if (cursors.right.isDown) {
                player.setVelocityX(160);
                player.anims.play('right', true);
            } else {
                player.setVelocityX(0);
                player.anims.play('turn');
            }

            if (cursors.up.isDown) {
                player.setVelocityY(-160);
            } else if (cursors.down.isDown) {
                player.setVelocityY(160);
            } else {
                player.setVelocityY(0);
            }
        }

        async function triggerExam() {
            isLocked = true;
            document.getElementById('exam-modal').style.display = 'block';

            const question = "Who is the Shadow Monarch?";
            const options = ["Jin-Woo", "Thomas Andre", "Go Gun-Hee"];

            document.getElementById('question-text').innerText = question;
            const container = document.getElementById('options-container');
            container.innerHTML = '';

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerText = opt;
                btn.onclick = () => submitExam(opt);
                container.appendChild(btn);
            });
        }

        function submitExam(answer) {
            alert("Answered: " + answer + ". XP Awarded!");
            isLocked = false;
            document.getElementById('exam-modal').style.display = 'none';

            document.getElementById('xp').innerText = "100";
            document.getElementById('int').innerText = "6";
        }
    </script>
</body>
</html>
